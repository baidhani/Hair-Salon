<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New booking</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header class="site">
  <strong>Salon bookings</strong>
  <a href="/" aria-current="page">New booking</a>
  <a href="/review">Review &amp; send</a>
</header>
<main>
  <h1>New booking</h1>
  <p class="hint">Enter the customer's details. We check them before the booking is prepared. Nothing is emailed until you approve it on the Review page.</p>
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <form id="f" class="card" novalidate>
    <label for="name">Customer name</label>
    <input id="name" name="name" autocomplete="off" aria-describedby="e-name">
    <div class="field-error" id="e-name"></div>
    <label for="email">Email <span class="hint">(the confirmation is sent here)</span></label>
    <input id="email" name="email" type="email" autocomplete="off" aria-describedby="e-email">
    <div class="field-error" id="e-email"></div>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" autocomplete="off" aria-describedby="e-phone">
    <div class="field-error" id="e-phone"></div>
    <label for="service">Service</label>
    <input id="service" name="service" autocomplete="off" aria-describedby="e-service">
    <div class="field-error" id="e-service"></div>
    <label for="requestedAt">Appointment date and time <span class="hint">(a booking without one is flagged for review)</span></label>
    <input id="requestedAt" name="requestedAt" type="datetime-local" aria-describedby="e-requestedAt">
    <div class="field-error" id="e-requestedAt"></div>
    <button class="primary" id="submit">Check details and prepare booking</button>
  </form>
</main>
<script src="/ui.js"></script>
<script>
UI.installErrorHandler();
const f = document.getElementById('f'), submit = document.getElementById('submit');
// A new requestId per edited form; a retry after a network failure reuses it, so nothing is booked twice.
let requestId = crypto.randomUUID();
f.addEventListener('input', () => { requestId = crypto.randomUUID(); });

function showFieldErrors(errors) {
  for (const k of ['name', 'email', 'phone']) {
    const found = errors.find(e => e.field === k);
    document.getElementById('e-' + k).textContent = found ? found.message : '';
    document.getElementById(k).setAttribute('aria-invalid', found ? 'true' : 'false');
  }
  const first = errors[0] && document.getElementById(errors[0].field);
  if (first) first.focus();
}

// Contact details go in `contact`; the appointment details sit beside it. A blank time is sent as missing, not as an empty string.
function bookingBody() {
  const all = Object.fromEntries(new FormData(f));
  const { service, requestedAt, ...contact } = all;
  const when = requestedAt ? new Date(requestedAt).toISOString() : undefined;
  return { requestId, contact, service: service.trim() || undefined, requestedAt: when };
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  showFieldErrors([]);
  submit.disabled = true;
  UI.notify('info', 'Checking the details…');
  UI.logEvent('booking_form_submitted');
  try {
    const { status, data } = await UI.request('POST', '/bookings', bookingBody());
    if (data.status === 'confirmed') {
      UI.notify(data.flag && data.flag.flagged ? 'info' : 'success', 'Details verified for ' + data.booking.name + '. The booking is waiting for your review' +
        (data.flag && data.flag.flagged ? ' and has been flagged — open Review & send to see why' : '') + ' — nothing has been emailed yet.');
      f.reset(); requestId = crypto.randomUUID();
    } else if (data.status === 'rejected') {
      showFieldErrors(data.errors);
      UI.notify('error', 'Please correct the highlighted details. The booking was not prepared.');
    } else {
      UI.notify('error', data.message || 'Something went wrong (code ' + status + '). Nothing was booked — please try again.');
    }
  } catch (err) {
    UI.notify('error', err.message);
  } finally {
    submit.disabled = false;
  }
});
</script>
</body>
</html>
