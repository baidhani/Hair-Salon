<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review and send</title>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header class="site">
  <strong>Salon bookings</strong>
  <a href="/">New booking</a>
  <a href="/review" aria-current="page">Review &amp; send</a>
</header>
<main>
  <h1>Review and send</h1>
  <p class="hint">Step 1: check each prepared booking, fix anything wrong, then approve it. Step 2: send the confirmation email. Nothing is sent until you press Send.</p>
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <h2>1. Waiting for your review</h2>
  <div id="list"></div>
  <h2>2. Approved — ready to send</h2>
  <div id="approved"></div>
</main>
<script src="/ui.js"></script>
<script>
UI.installErrorHandler();
const listEl = document.getElementById('list'), approvedEl = document.getElementById('approved');
const FIELDS = [['name', 'Name'], ['email', 'Email'], ['phone', 'Phone']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load() {
  try {
    const { ok, data } = await UI.request('GET', '/api/review');
    if (!ok) throw new Error('The list could not be loaded. Nothing was changed — please refresh the page.');
    listEl.innerHTML = data.bookings.length ? data.bookings.map(b => `<div class="card" data-id="${esc(b.id)}">
      <span class="badge prepared">Waiting for review</span>
      ${FIELDS.map(([k, l]) => `<label for="${esc(b.id)}-${k}">${l}</label>
        <input id="${esc(b.id)}-${k}" name="${k}" value="${esc(b.contact[k])}" aria-describedby="${esc(b.id)}-e-${k}">
        <div class="field-error" id="${esc(b.id)}-e-${k}"></div>`).join('')}
      <button data-act="save">Save changes</button><button class="primary" data-act="approve">Approve</button>
      <span class="note" role="status"></span></div>`).join('')
      : '<p class="empty">Nothing is waiting for review. New bookings appear here after their details are checked.</p>';
    approvedEl.innerHTML = data.approved.length ? data.approved.map(b => `<div class="card" data-id="${esc(b.id)}">
      <span class="badge approved">Approved</span> <strong>${esc(b.contact.name)}</strong> · ${esc(b.contact.email)}<br>
      <button class="primary" data-act="send">Send confirmation</button><span class="note" role="status"></span></div>`).join('')
      : '<p class="empty">Nothing approved yet. Approve a booking above and it will appear here.</p>';
  } catch (err) {
    UI.notify('error', err.message);
  }
}

async function act(button) {
  const kind = button.dataset.act, card = button.closest('.card'), id = card.dataset.id, note = card.querySelector('.note');
  const url = '/api/review/' + encodeURIComponent(id);
  note.textContent = '';
  card.querySelectorAll('.field-error').forEach(d => { d.textContent = ''; });

  if (kind === 'approve' && !confirm('Approve this booking? You can still send the confirmation later.')) return;
  if (kind === 'send' && !confirm('Send the confirmation email to the customer now? This cannot be undone.')) return;

  button.disabled = true;
  try {
    if (kind === 'save') {
      UI.logEvent('booking_edited', id);
      const changes = Object.fromEntries([...card.querySelectorAll('input')].map(i => [i.name, i.value]));
      const { data } = await UI.request('PATCH', url, { changes });
      if (data.status === 'prepared') { UI.notify('success', 'Changes saved.'); }
      else if (data.status === 'rejected') {
        data.errors.forEach(x => { card.querySelector('[id$="-e-' + x.field + '"]').textContent = x.message; });
        UI.notify('error', 'Not saved — please correct the highlighted details.');
      } else UI.notify('error', data.message || 'The changes could not be saved. Nothing was changed.');
    } else if (kind === 'approve') {
      UI.logEvent('booking_approved', id);
      const { data } = await UI.request('POST', url + '/approve');
      if (data.status === 'approved') { await load(); UI.notify('success', 'Approved. It is now listed under "Approved — ready to send".'); }
      else UI.notify('error', data.message || 'Could not approve. The booking is still waiting for review.');
    } else if (kind === 'send') {
      UI.logEvent('confirmation_send_clicked', id);
      const { data } = await UI.request('POST', url + '/send');
      if (data.status === 'sent') {
        await load();
        UI.notify('success', 'Confirmation sent.' + (data.logged === false ? ' (The log entry will be retried.)' : ''));
      } else UI.notify('error', data.message || 'The confirmation was not sent. The booking is still approved.');
    }
  } catch (err) {
    UI.notify('error', err.message);
  } finally {
    button.disabled = false;
  }
}

document.addEventListener('click', e => { if (e.target.dataset && e.target.dataset.act) act(e.target); });
UI.logEvent('review_page_opened');
load();
</script>
</body>
</html>
