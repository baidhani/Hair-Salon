<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review bookings</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem}
  .b{border:1px solid #ddd;border-radius:8px;padding:.8rem;margin:.8rem 0}
  label{display:block;margin-top:.4rem}input{width:100%;padding:.4rem;box-sizing:border-box}
  .err{color:#b00020;font-size:.9rem}.ok{color:#0a6b2d}button{margin:.6rem .4rem 0 0;padding:.4rem .8rem}
</style>
</head>
<body>
<h1>Review prepared bookings</h1>
<p>Nothing is sent until you approve it.</p>
<p id="top" role="status"></p>
<div id="list"></div>
<p><a href="/">← New booking</a></p>
<script>
const list = document.getElementById('list'), top = document.getElementById('top');
const FIELDS = [['name', 'Name'], ['email', 'Email'], ['phone', 'Phone']];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const say = (el, cls, text) => { el.className = cls; el.textContent = text; };

async function call(method, url, body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  return res.json();
}

async function load() {
  say(top, '', 'Loading…');
  try {
    const { bookings } = await call('GET', '/api/review');
    say(top, '', bookings.length ? '' : 'No prepared bookings waiting for review.');
    list.innerHTML = bookings.map(b => `<div class="b" data-id="${esc(b.id)}">
      ${FIELDS.map(([k, l]) => `<label>${l} <input name="${k}" value="${esc(b.contact[k])}"></label><div class="err" data-for="${k}"></div>`).join('')}
      <button data-act="save">Save changes</button><button data-act="approve">Approve</button><span class="note" role="status"></span></div>`).join('');
  } catch { say(top, 'err', 'Could not load the bookings. Nothing was changed — please refresh.'); }
}

list.addEventListener('click', async e => {
  const act = e.target.dataset.act; if (!act) return;
  const box = e.target.closest('.b'), id = box.dataset.id, note = box.querySelector('.note');
  box.querySelectorAll('.err').forEach(d => { d.textContent = ''; });
  try {
    if (act === 'save') {
      const changes = Object.fromEntries([...box.querySelectorAll('input')].map(i => [i.name, i.value]));
      const r = await call('PATCH', '/api/review/' + encodeURIComponent(id), { changes });
      if (r.status === 'prepared') say(note, 'ok', 'Saved.');
      else if (r.status === 'rejected') {
        r.errors.forEach(x => { box.querySelector('[data-for="' + x.field + '"]').textContent = x.message; });
        say(note, 'err', 'Not saved — correct the details above.');
      } else say(note, 'err', r.message || 'Could not save.');
    } else {
      const r = await call('POST', '/api/review/' + encodeURIComponent(id) + '/approve');
      if (r.status === 'approved') { box.remove(); say(top, 'ok', 'Approved.'); }
      else say(note, 'err', r.message || 'Could not approve. The booking is still waiting.');
    }
  } catch { say(note, 'err', 'Could not reach the server. Nothing was changed.'); }
});
load();
</script>
</body>
</html>
